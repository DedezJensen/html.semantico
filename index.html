<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    
    <header> <!-- a tag 'header' manipula no cabeçalho da pagina -->
        header
    </header>

    <nav> <!-- a tag 'nav' manipula a parte de navegação da pagina -->
        nav
    </nav>

    <aside> <!-- a tag 'aside' manipula o menu lateral da da pagina -->
        aside
    </aside>

    <main> <!-- a tag 'main' manipula o menu principal da pagina -->
        main

        <article> <!-- a tag 'article' manipula os artigos da pagina -->
            article

            <figure>figure</figure> <!-- a tag 'figure' serve para as figuras da pagina -->
            <p>p</p> <!-- a tag 'p' elabora um paragrafo -->

        </article>

        <section>section</section>

    </main>

    <footer>footer</footer>







</body>

</html>
